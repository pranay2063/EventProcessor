services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    extra_hosts:
      - host.docker.internal:host-gateway
  app:
    build: .
    image: docker.io/library/app:latest
    ports:
      - 8080:8080
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
        - rabbitmq